apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dyn-a
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ufs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dyn-b
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ufs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: dyn-a
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo only-in-a > /data/who && ls /data"]
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: dyn-a}
---
apiVersion: v1
kind: Pod
metadata:
  name: dyn-b
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo only-in-b > /data/who && ls /data"]
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: dyn-b}
