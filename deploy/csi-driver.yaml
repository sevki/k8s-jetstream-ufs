apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ufs.jetstream.rs
spec:
  attachRequired: false
  podInfoOnMount: false
  volumeLifecycleModes: [Persistent, Ephemeral]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ufs-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: ufs-csi-node
  template:
    metadata:
      labels:
        app: ufs-csi-node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # lets the plugin resolve Service names
      containers:
        - name: driver
          image: k8s-jetstream-ufs:dev
          imagePullPolicy: IfNotPresent
          args: ["csi", "--endpoint", "/csi/csi.sock"]
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true # needs mount(2)
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
        - name: registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.11.1
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/ufs.jetstream.rs/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration
              mountPath: /registration
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/ufs.jetstream.rs
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
