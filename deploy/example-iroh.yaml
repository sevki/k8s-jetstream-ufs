apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iroh-a
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ufs-iroh
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iroh-a
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo over-iroh > /data/who && ls /data"]
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: iroh-a}
